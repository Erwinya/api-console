<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>API Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="top">
    <div>
      <p class="kicker">API Console</p>
      <h1>Inspect HTTP requests in the browser</h1>
    </div>
  </header>

  <main class="layout">
    <form id="request-form" class="panel">
      <div class="row">
        <label>
          Method
          <select id="method" name="method">
            <option>GET</option>
            <option>POST</option>
            <option>PUT</option>
            <option>PATCH</option>
            <option>DELETE</option>
          </select>
        </label>
        <label class="grow">
          URL
          <input id="url" name="url" type="url" required placeholder="https://httpbingo.org/get" value="https://httpbingo.org/get" />
        </label>
      </div>
    </form>
  </main>
</body>
</html>
